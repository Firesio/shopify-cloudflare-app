# PRODUCTION app config. Learn more:
# https://shopify.dev/docs/apps/tools/cli/configuration
#
# This is the DEFAULT config, so a bare `shopify app deploy` targets production.
# Local development uses shopify.app.dev.toml (`npm run dev`), which points at a
# SEPARATE app in your Dev Dashboard — see that file's header.
#
# Fill client_id in with `npm run config:link:prod`.

client_id = ""
name = "My App"
application_url = "https://example.com"
embedded = true

[build]
# Production's URL is fixed; never let `shopify app dev` rewrite it. Dev runs
# against shopify.app.dev.toml, which keeps that true.
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # MANDATORY for every app distributed through the Shopify App Store — all
  # three topics, whether or not the app stores personal data. Missing or
  # non-functioning compliance webhooks are an automatic review rejection.
  # An invalid HMAC must return 401; app/routes/webhooks/receive.ts does,
  # and it acknowledges 2xx only once the delivery is durably queued.
  # https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Keep this minimal, and keep it in sync with shopify.app.dev.toml — a scope
# that exists in only one env produces bugs that reproduce in only one env.
scopes = ""

[auth]
redirect_urls = [ "https://example.com/auth/callback" ]
