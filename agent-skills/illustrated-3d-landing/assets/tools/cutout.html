<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutout tool — flat-colour background to transparent</title>
<style>
  :root { --bg: #0e1016; --ink: #eceee9; --muted: #9ea3a0; --line: rgba(236,238,233,.16); --accent: #ffc27a; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); padding: 1.5rem; line-height: 1.5; }
  h1 { font-weight: 500; font-size: 1.2rem; } p.hint { color: var(--muted); font-size: .9rem; max-width: 60ch; margin: .4rem 0 1.2rem; }
  .bar { display: flex; flex-wrap: wrap; gap: 1.2rem; align-items: center; padding: .9rem 1rem; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 1.2rem; }
  label { display: grid; gap: .25rem; font-size: .75rem; color: var(--muted); } input[type=range] { width: 11rem; } input[type=color] { width: 3rem; height: 2rem; border: 0; background: none; }
  button, .file { font: inherit; font-size: .85rem; color: var(--ink); background: #1a1d27; border: 1px solid var(--line); border-radius: 999px; padding: .5rem 1rem; cursor: pointer; min-height: 2.5rem; }
  button:hover, .file:hover { border-color: var(--accent); } input[type=file] { display: none; }
  #drop { border: 1px dashed var(--line); border-radius: 12px; padding: 1.4rem; text-align: center; color: var(--muted); margin-bottom: 1.2rem; }
  #drop.over { border-color: var(--accent); color: var(--ink); }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); }
  .card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #12151d; }
  .card canvas { display: block; width: 100%; height: auto; cursor: crosshair; background: repeating-conic-gradient(#2a2e3a 0% 25%, #1d2029 0% 50%) 50% / 18px 18px; }
  .card footer { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .6rem .8rem; font-size: .78rem; color: var(--muted); }
  .card footer span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<h1>Cutout tool</h1>
<p class="hint">Removes a flat background colour (default magenta #FF00FF) and keeps clean edges. Everything runs in this page, nothing is uploaded. Click the background of a picture to pick its exact colour.</p>

<div class="bar">
  <label>Key colour<input type="color" id="key" value="#ff00ff"></label>
  <label>Tolerance <output id="tolO">60</output><input type="range" id="tol" min="5" max="200" value="60"></label>
  <label>Edge softness <output id="softO">40</output><input type="range" id="soft" min="1" max="120" value="40"></label>
  <label class="file-l"><span class="file" role="button" tabindex="0" id="pick">Choose images</span><input type="file" id="files" accept="image/*" multiple></label>
  <button type="button" id="all">Download all (WebP)</button>
</div>
<div id="drop">Drop your Gemini images here</div>
<div class="grid" id="grid"></div>

<script>
const $ = (s) => document.querySelector(s);
const items = [];
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

// observed = a * foreground + (1 - a) * key  =>  foreground = (observed - (1 - a) * key) / a   (removes the coloured fringe)
function process(item) {
  const { img, canvas } = item, ctx = canvas.getContext("2d", { willReadFrequently: true });
  canvas.width = img.naturalWidth; canvas.height = img.naturalHeight; ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, canvas.width, canvas.height), p = d.data, key = hex($("#key").value), tol = +$("#tol").value, soft = +$("#soft").value;
  for (let i = 0; i < p.length; i += 4) {
    const dr = p[i] - key[0], dg = p[i + 1] - key[1], db = p[i + 2] - key[2], dist = Math.sqrt(dr * dr + dg * dg + db * db);
    let a = (dist - tol) / soft; a = a < 0 ? 0 : a > 1 ? 1 : a; a = a * a * (3 - 2 * a);
    if (a <= 0) { p[i + 3] = 0; continue; }
    if (a < 1) for (let k = 0; k < 3; k++) { const v = (p[i + k] - (1 - a) * key[k]) / a; p[i + k] = v < 0 ? 0 : v > 255 ? 255 : v; }
    p[i + 3] = Math.round(a * 255);
  }
  ctx.putImageData(d, 0, 0);
}
const redraw = () => items.forEach(process);
for (const id of ["key", "tol", "soft"]) $("#" + id).addEventListener("input", () => { $("#tolO").value = $("#tol").value; $("#softO").value = $("#soft").value; redraw(); });

function add(file) {
  const img = new Image(); img.onload = () => {
    const card = document.createElement("div"); card.className = "card";
    const canvas = document.createElement("canvas"), foot = document.createElement("footer"), name = document.createElement("span"), btn = document.createElement("button");
    name.textContent = file.name.replace(/\.[^.]+$/, ""); btn.type = "button"; btn.textContent = "Download WebP"; foot.append(name, btn); card.append(canvas, foot); $("#grid").append(card);
    const item = { img, canvas, name: name.textContent }; items.push(item);
    canvas.addEventListener("click", (e) => {      // pick the key colour from the ORIGINAL pixels under the cursor
      const r = canvas.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * img.naturalWidth), y = Math.floor((e.clientY - r.top) / r.height * img.naturalHeight);
      const t = document.createElement("canvas"); t.width = t.height = 1; const c = t.getContext("2d"); c.drawImage(img, x, y, 1, 1, 0, 0, 1, 1); const [r0, g0, b0] = c.getImageData(0, 0, 1, 1).data;
      $("#key").value = "#" + [r0, g0, b0].map((v) => v.toString(16).padStart(2, "0")).join(""); redraw();
    });
    btn.addEventListener("click", () => save(item)); process(item);
  }; img.src = URL.createObjectURL(file);
}
function save(item) { item.canvas.toBlob((b) => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = item.name + ".webp"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, "image/webp", .92); }
$("#all").addEventListener("click", () => items.forEach((it, i) => setTimeout(() => save(it), i * 250)));
$("#pick").addEventListener("click", () => $("#files").click()); $("#pick").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#files").click(); } });
$("#files").addEventListener("change", (e) => [...e.target.files].forEach(add));
const drop = $("#drop"); ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); })); ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => [...e.dataTransfer.files].filter((f) => f.type.startsWith("image/")).forEach(add));
</script>
</body>
</html>
