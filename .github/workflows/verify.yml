# Typecheck, lint, tests and a production build. To save Actions minutes it runs only on a pull request that touches
# code (docs and Markdown alone do not trigger it), on a release tag `v*`, or by hand (Actions > verify > Run workflow).
# A push to main does NOT run it, and may deploy production (Workers Builds): run `npm run verify` before you push.
name: verify

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "agent-skills/**"
      - ".claude/**"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # @firesio/* come from GitHub Packages: a READ-ONLY token (read:packages), set as a repository secret.
      # .npmrc only references this variable; a token is never written to a file.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Type-aware ESLint over the app and the libraries' source needs more than the default 2 GB heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The generated Worker types are current
        run: |
          npx wrangler types
          git diff --exit-code worker-configuration.d.ts
      - run: npm run verify
      - name: Production build
        run: CLOUDFLARE_ENV=production npx react-router build
