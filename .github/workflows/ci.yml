name: CI

# Off by default: this repository is a template, so nothing here should run on
# every push or pull request. An app built from it turns CI back on by restoring
# the `push` and `pull_request` triggers below. `workflow_dispatch` keeps a manual
# run available from the Actions tab.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same ref supersedes an older run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Node comes from .nvmrc (24 = the current Active LTS line). package.json
      # `engines` is the minimum a dependency needs; .nvmrc is what CI runs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # typecheck + lint + tests. Tests run against real workerd via
      # @cloudflare/vitest-plugin, with outbound network blocked.
      - run: npm run verify

      # Prove the production build works — it is where the environment gets
      # baked in, so a broken one only shows up here.
      - run: CLOUDFLARE_ENV=production npm run build
